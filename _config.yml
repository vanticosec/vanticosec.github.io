# ---------------------------------------------------------------
#  Vantico Tech — configuração do site
# ---------------------------------------------------------------
title: Vantico Tech
tagline: Artigos e wiki de segurança ofensiva da Vantico
description: >-
  Artigos técnicos e uma wiki de referência mantidos pelo time da Vantico,
  especialistas em segurança ofensiva.
lang: pt-BR
timezone: America/Sao_Paulo

# Repo vanticosec/vanticosec.github.io → servido na raiz, baseurl vazio.
# Se o repo tiver outro nome (<org>.github.io/<repo>), ponha "/<repo>".
url: "https://vanticosec.github.io"
baseurl: ""

company_url: https://vantico.com.br
repository: vanticosec/vanticosec.github.io   # usado no link "Editar esta página"
logo: /assets/img/logo.svg

social:
  github: vanticosec
  linkedin: company/vantico
  instagram: vanticosec
  youtube: "@vanticosec"

# Autores — referencie em cada post com `author: <chave>`
authors:
  kaique:
    name: Kaique Bonato
    role: Engenharia
    github: kaiquebonato
  equipe:
    name: Time Vantico
    role: Engenharia

permalink: /:year/:month/:title/

# Wiki — cada pasta em _wiki/ é uma seção (veja o README)
collections:
  wiki:
    output: true
    permalink: /wiki/:path/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      author: equipe
  - scope: { path: "", type: wiki }
    values:
      layout: doc
  - scope: { path: "" }
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

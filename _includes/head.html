<script>
  // aplica o tema antes de renderizar para evitar "flash" (padrão: tema do sistema)
  document.documentElement.dataset.theme = localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>

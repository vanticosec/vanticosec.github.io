<header class="site-header">
  <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ site.logo | relative_url }}" alt="" width="24" height="24">
    <span>Vantico <strong>Tech</strong></span>
  </a>
  <nav class="top-links" aria-label="Principal">
    <a href="{{ '/artigos/' | relative_url }}" {% if page.layout == 'post' or page.url == '/artigos/' %}class="active"{% endif %}>Artigos</a>
    <a href="{{ '/wiki/' | relative_url }}" {% if page.collection == 'wiki' or page.url == '/wiki/' %}class="active"{% endif %}>Wiki</a>
  </nav>
  <div class="header-actions">
    <a class="ext" href="{{ site.company_url }}" target="_blank" rel="noopener">vantico.com.br ↗</a>
    <button class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
      <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

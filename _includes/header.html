<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="" width="30" height="30">
      <span class="brand-name">vantico<span class="brand-sep">/</span><strong>tech</strong></span>
    </a>
    <nav class="nav-links" aria-label="Principal">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>artigos</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.url == '/tags/' %}class="active"{% endif %}>tags</a>
      <a href="{{ '/sobre/' | relative_url }}" {% if page.url == '/sobre/' %}class="active"{% endif %}>sobre</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </nav>
    <div class="nav-actions">
      <button class="theme-toggle" type="button" aria-label="Alternar tema claro/escuro">
        <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="{{ site.company_url }}" class="btn btn-primary btn-sm" target="_blank" rel="noopener">vantico.com.br <span aria-hidden="true">↗</span></a>
    </div>
  </div>
</header>

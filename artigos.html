---
title: Artigos
permalink: /artigos/
---
<ul class="post-list">
  {% for p in site.posts %}
  <li>
    <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: '%d/%m/%Y' }}</time>
    <div>
      <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
      {% if p.description %}<p>{{ p.description }}</p>{% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
